<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Flexbox Assignment</title>
    <link rel="stylesheet" href="Style.css">
</head>


<body>

    <h1>CSS Flexbox Assignment</h1>


    <!-- =================================
         PART A - BOUNCING LOADER
    ================================== -->

    <section>

        <h2>A. Bouncing Loader Animation</h2>

        <div class="loader">

            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>

        </div>

    </section>



    <!-- =================================
         PART B - PHOTO GALLERY
    ================================== -->

    <section>

        <h2>B. Photo Gallery Using CSS Flex</h2>

        <div class="gallery">

            <div class="photo">
                <img src="Photo_1.png" alt="Photo 1">
            </div>

            <div class="photo">
                <img src="Photo_2.png" alt="Photo 2">
            </div>

            <div class="photo">
                <img src="Photo_3.png" alt="Photo 3">
            </div>

            <div class="photo">
                <img src="Photo_4.png" alt="Photo 4">
            </div>

            <div class="photo">
                <img src="Photo_5.png" alt="Photo 5">
            </div>

            <div class="photo">
                <img src="Photo_6.png" alt="Photo 6">
            </div>
            

            <div class="photo">
                <img src="Photo_7.png" alt="Photo 7">
            </div>

            <div class="photo">
                <img src="Photo_8.png" alt="Photo 8">
            </div>

        </div>

    </section>



    <!-- =================================
         PART C - FLEX CONTAINER & CHILD
    ================================== -->

    <section>

        <h2>C. Flex Container and Flex Child Properties</h2>

        <div class="flex-container">

            <div class="box box1">Box 1</div>

            <div class="box box2">Box 2</div>

            <div class="box box3">Box 3</div>

            <div class="box box4">Box 4</div>

            <div class="box box5">Box 5</div>

            <div class="box box6">Box 6</div>

        </div>

    </section>


</body>

</html>
